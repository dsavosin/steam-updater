[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-updater"
version = "0.1.0"
description = "Translate Steam store page descriptions into many languages with Claude, via the Steamworks localization JSON workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40,<2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
steam-updater = "steam_updater.cli:main"

[tool.setuptools.packages.find]
include = ["steam_updater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
